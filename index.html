<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101914" />
    <meta name="description" content="Echoes of Aether - a fantasy pixel-art RPG" />
    <title>Echoes of Aether</title>
  </head>
  <body>
    <main id="app">
      <div id="game" aria-label="Echoes of Aether game" aria-describedby="game-help"></div>
      <p id="game-help" class="sr-only">Use WASD or arrow keys to move, space to attack, Q for skill, E or Enter to interact, I for inventory, J for quest, P for potions, and Escape to pause. In menus, press the number shown beside an option.</p>
      <div id="game-status" class="sr-only" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
